version: 2
updates:
# Rust — the echo crate (this repo is not a Cargo workspace)
- package-ecosystem: cargo
  directory: "/echo"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    cargo-minor-patch:
      update-types:
      - minor
      - patch
  labels:
  - dependencies
  - rust

# Dockerfile base images
- package-ecosystem: docker
  directory: "/echo"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  labels:
  - dependencies
  - docker

# GitHub Actions used by the workflows in .github/workflows
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    actions-all:
      patterns:
      - "*"
  labels:
  - dependencies
  - github-actions
