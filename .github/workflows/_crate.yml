name: Crate

# mcp uses standalone Rust crates, so cargo checks run on the runner instead of a crate-local
# "ci-tools" Docker target; the runtime image still supports BINARY_SOURCE=prebuilt for publish parity.
on:
  workflow_call:
    inputs:
      crate:
        required: true
        type: string

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      CRATE: ${{ inputs.crate }}
      SERVICE: mcp-${{ inputs.crate }}
      BINARY: botwork-mcp-${{ inputs.crate }}
      DOCKERFILE: ${{ inputs.crate }}/Dockerfile

    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          ${{ inputs.crate }}
    - uses: docker/setup-buildx-action@v3

    - name: cargo fmt
      run: |
        set -euo pipefail
        cd "$CRATE"
        cargo fmt -- --check

    - name: cargo clippy
      run: |
        set -euo pipefail
        cd "$CRATE"
        cargo clippy --all-targets --locked -- -D warnings

    - name: cargo test
      run: |
        set -euo pipefail
        cd "$CRATE"
        cargo test --locked

    - name: cargo build
      env:
        BOTWORK_GIT_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        cd "$CRATE"
        cargo build --release --locked

    - name: Install hadolint
      run: |
        set -euo pipefail
        HADOLINT_VERSION=v2.12.0
        curl -fsSL -o /usr/local/bin/hadolint \
          "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-Linux-x86_64"
        chmod +x /usr/local/bin/hadolint
        hadolint --version

    - name: Lint Dockerfile
      run: hadolint --failure-threshold error "$DOCKERFILE"

    - name: Stage prebuilt binary
      run: |
        set -euo pipefail
        install -D -m 0755 "$CRATE/target/release/$BINARY" ".ci-prebuilt/$CRATE/$BINARY"

    - name: Read VERSION
      id: version
      run: |
        set -euo pipefail
        echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

    - name: Build runtime image
      env:
        BOTWORK_VERSION: ${{ steps.version.outputs.version }}
      run: |
        set -euo pipefail
        docker buildx build \
          --platform linux/amd64 \
          --load \
          --build-arg BINARY_SOURCE=prebuilt \
          --build-arg "GIT_SHA=${GITHUB_SHA}" \
          --build-arg "BOTWORK_VERSION=${BOTWORK_VERSION}" \
          --build-arg "BOTWORK_GIT_SHA=${GITHUB_SHA}" \
          -t "botwork/$SERVICE:ci" \
          -f "$DOCKERFILE" \
          .

    - name: Verify OCI labels
      env:
        BOTWORK_VERSION: ${{ steps.version.outputs.version }}
      run: |
        set -euo pipefail
        image="botwork/${SERVICE}:ci"
        expect_source="https://github.com/botworkz/mcp"
        actual_version="$(docker image inspect "$image" \
          --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
        actual_revision="$(docker image inspect "$image" \
          --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
        actual_source="$(docker image inspect "$image" \
          --format '{{ index .Config.Labels "org.opencontainers.image.source" }}')"
        fail=0
        if [ "$actual_version" != "$BOTWORK_VERSION" ]; then
          echo "::error::image.version mismatch on $image: expected '$BOTWORK_VERSION', got '$actual_version'"
          fail=1
        fi
        if [ "$actual_revision" != "$GITHUB_SHA" ]; then
          echo "::error::image.revision mismatch on $image: expected '$GITHUB_SHA', got '$actual_revision'"
          fail=1
        fi
        if [ "$actual_source" != "$expect_source" ]; then
          echo "::error::image.source mismatch on $image: expected '$expect_source', got '$actual_source'"
          fail=1
        fi
        if [ "$fail" -ne 0 ]; then
          exit 1
        fi
        echo "OCI labels OK on $image: version=$actual_version revision=${actual_revision:0:7} source=$actual_source"

    - name: Start runtime image
      run: |
        set -euo pipefail
        cid="$(docker run -d --rm -p 18000:8000 "botwork/$SERVICE:ci")"
        echo "cid=$cid" >> "$GITHUB_ENV"

        ready=false
        for _ in $(seq 1 30); do
          if docker logs "$cid" 2>&1 | grep -q 'starting on 0.0.0.0:8000/mcp'; then
            ready=true
            break
          fi
          sleep 0.5
        done

        if [ "$ready" != true ]; then
          echo "container never reported readiness"
          docker logs "$cid" || true
          exit 1
        fi

        # Version banner: assert <binary> <ver>[+<sha>] is in the log.
        banner="$(docker logs "$cid" 2>&1 | grep -oE "$BINARY [^[:space:]]+" | head -n1 || true)"
        echo "version banner: $banner"
        if [ -z "$banner" ]; then
          echo "::error::no $BINARY version banner in container log"
          docker logs "$cid" || true
          exit 1
        fi

        # If VERSION is dev, require a +<short-sha> suffix.
        version="$(tr -d '[:space:]' < VERSION)"
        case "$version" in
          *-dev*)
            if ! printf '%s\n' "$banner" | grep -qE '\+[0-9a-f]{7}'; then
              echo "::error::dev VERSION '$version' but banner lacks +<sha>: '$banner'"
              docker logs "$cid" || true
              exit 1
            fi
            ;;
        esac

    - name: MCP initialize
      id: initialize
      run: |
        set -euo pipefail
        base="http://127.0.0.1:18000/mcp"
        hdrs="$(mktemp)"
        data='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"1.0"}}}'
        body="$(curl -sS -D "$hdrs" \
          -H 'Content-Type: application/json' \
          -H 'Accept: application/json, text/event-stream' \
          -d $data \
          "$base")"
        echo "initialize raw response:"
        echo "$body"
        sid="$(grep -i '^mcp-session-id:' "$hdrs" | sed 's/^[^:]*: *//' | tr -d '\r')"
        if [ -z "$sid" ]; then
          echo "::error::initialize returned no mcp-session-id"
          docker logs "$cid" || true
          exit 1
        fi
        payload="$(echo "$body" | grep '^data: ' | tail -n1 | sed 's/^data: //')"
        echo "session-id=$sid" >> "$GITHUB_OUTPUT"
        echo "payload=$payload" >> "$GITHUB_OUTPUT"

    - name: Assert initialize payload
      uses: envoyproxy/toolshed/gh-actions/jq@actions-v0.3.26
      with:
        input: ${{ steps.initialize.outputs.payload }}
        filter: |
          if (.id == 1) and (.result.serverInfo.name | (. != null and . != ""))
          then "ok"
          else error("initialize payload assertion failed: \(.)")
          end

    - name: MCP initialized + tools/list + echo call
      id: calls
      run: |
        set -euo pipefail
        base="http://127.0.0.1:18000/mcp"
        sid="${{ steps.initialize.outputs.session-id }}"

        # notifications/initialized -> 202
        code="$(curl -sS -o /dev/null -w '%{http_code}' \
          -H 'Content-Type: application/json' \
          -H 'Accept: application/json, text/event-stream' \
          -H "mcp-session-id: $sid" \
          -d '{"jsonrpc":"2.0","method":"notifications/initialized","params":{}}' \
          "$base")"
        echo "notifications/initialized HTTP code: $code"
        if [ "$code" != "202" ]; then
          echo "::error::notifications/initialized returned HTTP $code, want 202"
          docker logs "$cid" || true
          exit 1
        fi

        # tools/list
        tools_body="$(curl -sS \
          -H 'Content-Type: application/json' \
          -H 'Accept: application/json, text/event-stream' \
          -H "mcp-session-id: $sid" \
          -d '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
          "$base")"
        echo "tools/list raw response:"
        echo "$tools_body"
        tools="$(echo "$tools_body" | grep '^data: ' | tail -n1 | sed 's/^data: //')"
        echo "tools=$tools" >> "$GITHUB_OUTPUT"

        # tools/call echo
        data='{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"echo","arguments":{"message":"ci-smoke-hello"}}}'
        echo_body="$(curl -sS \
          -H 'Content-Type: application/json' \
          -H 'Accept: application/json, text/event-stream' \
          -H "mcp-session-id: $sid" \
          -d "$data" \
          "$base")"
        echo "tools/call echo raw response:"
        echo "$echo_body"
        echo_payload="$(echo "$echo_body" | grep '^data: ' | tail -n1 | sed 's/^data: //')"
        echo "echo=$echo_payload" >> "$GITHUB_OUTPUT"

    - name: Assert tools/list advertises echo
      uses: envoyproxy/toolshed/gh-actions/jq@actions-v0.3.26
      with:
        input: ${{ steps.calls.outputs.tools }}
        filter: |
          if (.result.tools | map(.name) | index("echo")) != null
          then "ok"
          else error("tools/list does not advertise 'echo': \(.)")
          end

    - name: Assert echo tools/call round-trips
      uses: envoyproxy/toolshed/gh-actions/jq@actions-v0.3.26
      with:
        input: ${{ steps.calls.outputs.echo }}
        filter: |
          if (.id == 3)
            and (.result.structuredContent.message == "ci-smoke-hello")
            and (.result.structuredContent.plugin == "mcp-echo")
            and (.result.structuredContent.version | type == "string")
            and (.result.structuredContent.env | type == "array")
          then "ok"
          else error("echo tools/call assertion failed: \(.)")
          end

    - name: Container logs and teardown
      if: always()
      run: |
        [ -n "${cid:-}" ] && docker logs "$cid" || true
        [ -n "${cid:-}" ] && docker rm -f "$cid" || true

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.crate }}-binary
        path: ${{ env.CRATE }}/target/release/${{ env.BINARY }}
